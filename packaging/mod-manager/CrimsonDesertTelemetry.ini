; Production profile (CDT_RESEARCH=OFF). Restart after changes.
; Supported settings, dependencies and validation status: docs/INI_VALIDATION.md.
; Research controls are preserved in CrimsonDesertTelemetry.research.ini for ON builds.
[Server]
Enabled=1
; Integer TCP port, 1024-65535.
Port=27311
; Host publication rate, 1-240 Hz; does not increase GPU capture rates.
SampleRateHz=60

; Silent during normal startup/loading; brief success once the scene/data is ready.
; Errors remain visible until resolved. Uses the same D3D12 SDR/HDR renderer.
[Notifications]
Enabled=1
; Brief success notice, 5000-10000 ms.
DurationMilliseconds=6000

; Authored lights and current rendered lights. Requires an exactly supported build.
[Lights]
Enabled=1
; Integer radius around the player, 1-100000 game units (metre conversion unknown).
NearbyRadius=100
; GPU readback instrumentation, including paired scene constants, in the same ASI.
ManyLights=1
; Independent of the server sample rate. Supported range: 1-60 Hz.
ManyLightsSampleRateHz=20
; All-around current engine lights: also copies the ManyLights INPUT (before the
; renderer's view-dependent selection) with every sample, same GPU fence. Includes
; lights behind the camera and feeds HUD, radar, visibility and smoothing.
; Exact-build input anchors are verified; otherwise only the filtered view remains.
; 0 = filtered renderer output only (previous behaviour).
Upstream=1

; Global upper-hemisphere sky plus local camera sky visibility and ambient estimate.
; These are working-space estimates, not measured room brightness or physical lux.
; Separate HTTP/WebSocket sky feed at up to 2Hz; visibility has its own cadence.
; Requires Lights/ManyLights above.
[Ambient]
Enabled=1

; Per-light source visibility (2.2): the game's own physics casts nine rays from
; the camera to each light within LightOverlay/Radius around the player, including
; lights behind the camera. Any free ray = visible (cage bars block single rays);
; all nine blocked = blocked. Collision estimate, NOT optical transmission %.
; Up to 256 targets, max 20 scene batches/sec sharing a 2ms budget; results expire
; after 500ms and become unknown. Exact game build only; otherwise unknown.
; Raw/smoothed light records and RGB are available regardless of this switch.
[SourceVisibility]
Enabled=1

; Separate derived HTTP/WebSocket stream. Original source records and RGB stay intact.
[LightSmoothing]
; Exponential time constant, 0-2000 ms; 0 disables smoothing while retaining grouping.
TimeConstantMilliseconds=200
; Maximum spatial group extent in game units, 0.01-1; decimal point required.
; Proximity is not physical lamp identity. Directions remain per contribution.
GroupRadius=0.15

; Optional in-game Dear ImGui HUD. Restart the game after changing settings.
; DirectX 12: SDR, HDR10 (10-bit PQ/BT.2020), and scRGB (linear FP16).
; HDR rendering has automated coverage; a live HDR game/display test is pending.
[Overlay]
; Enabled by default. F8 hides the corner HUD independently.
; Graphics/client remain active if LightOverlay or Notifications are enabled.
Enabled=1
; Only controls initial visibility when Enabled=1; F8 can then show/hide the HUD.
InitiallyVisible=1
ShowDetails=1
; Enables 500 ms ambient polling while this HUD is enabled, including when hidden.
; Diagnostics (default F9) show the raw values/independent ages; needs Ambient.Enabled=1.
ShowAmbient=1
; Oblique local light overview; 0 restores the original root/camera compass.
Radar3D=1
; Decimal Windows virtual-key codes: 119=F8, 120=F9; 0 disables a shortcut.
ToggleKey=119
DetailsKey=120
; 0=top left, 1=top right, 2=bottom left, 3=bottom right
Corner=0
; Automatic scaling relative to 1080p; Scale is an additional multiplier, 0.5-3.
AutoScale=1
Scale=1.0
; Corner HUD panel opacity, 0.2-1.
Opacity=0.92
; UI reference white for HDR10/scRGB, in nits; 80-500. Does not change API values.
; Shared by radar, light markers and status notices, even if the corner HUD is off.
HdrPaperWhiteNits=200
; HUD envelope timeout, 100-10000 ms. Light age still has its separate 500 ms limit.
StaleMilliseconds=1000

; Independent fullscreen world-space light markers. Passive: no mouse capture.
; With Lights/Upstream=1: all current engine lights incl. behind the camera
; (hollow = not selected by the renderer in this view, not OFF). Otherwise the
; filtered renderer output only. Not a persistent lamp registry.
; Fresh visibility metadata is shown when available. With HideOccluded=0 blocked
; sources are dimmed and unknown/stale ones stay visible. Linear brightness is not lumens.
[LightOverlay]
Enabled=1
InitiallyVisible=1
; 121=F10; 0 disables the shortcut. F8 does not affect these world markers.
ToggleKey=121
; Initial HUD/radar display mode only. API/raw/smoothed records stay complete.
; 1 shows only sources with a fresh clear result; blocked, unknown, missing and
; stale results are hidden until a new clear measurement arrives.
HideOccluded=0
; 122=F11 toggles HideOccluded for both light views; 0 disables this shortcut.
; Only meaningful with SourceVisibility.Enabled=1; without it nothing is clear.
; Sampled collision rays can still be wrong for unusual geometry.
; All four HUD keys are configurable decimal Windows virtual-key codes.
OcclusionToggleKey=122
; Shared radius for world markers, 3D radar AND source visibility, 1-500 game units
; around the player; rays still start at the camera. With SourceVisibility the API
; radius is raised to at least this value. More lights share the 256-target budget.
Radius=100
; Marker bound for both views, 1-2048; 0 does not disable the view.
MaxMarkers=512
; Fullscreen detail-label bound, 0-16; 0 retains markers without labels.
MaxLabels=6
