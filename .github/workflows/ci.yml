name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build .\CrimsonDesertTelemetry.sln -c Release
      - name: Test
        run: dotnet run --project .\tests\CrimsonDesertTelemetry.Tests -c Release --no-build
      - name: API smoke test
        shell: pwsh
        run: .\tests\Test-Server.ps1
      - name: INI and package profile validation
        shell: pwsh
        run: .\tests\Test-ModManagerPackage.ps1 -SelfTest
      - name: Signed-distance sampler regression tests
        run: python tests/Test-SignedDistanceSampler.py
      - name: Configure and build native plugin/tests
        shell: pwsh
        run: |
          # Build the production ASI; direct research regression targets remain included.
          cmake -S native/CrimsonDesertTelemetry.Asi -B build/native-package -A x64 -DCDT_RESEARCH=OFF -DCDT_ALLOW_RESEARCH_NATIVE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native configure failed.' }
          cmake --build build/native-package --config Release -- /m:2
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed.' }
      - name: Native contract, capture and UI regression tests
        run: ctest --test-dir build/native-package -C Release --output-on-failure
      - name: Archived exact-build compatibility
        shell: pwsh
        run: |
          # The current production suite above includes recovery and its progress UI.
          # Preserve compilation and the no-recovery contract for the previous build.
          cmake -S native/CrimsonDesertTelemetry.Asi -B build/native-recovery-ci -A x64 -DCDT_RESEARCH=OFF -DCDT_NATIVE_BUILD_ID=26361232 -DCDT_ALLOW_RESEARCH_NATIVE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Recovery configure failed.' }
          cmake --build build/native-recovery-ci --config Release --target CrimsonDesertTelemetryRuntimeRecoveryTests -- /m:2
          if ($LASTEXITCODE -ne 0) { throw 'Recovery build failed.' }
          ctest --test-dir build/native-recovery-ci -C Release --output-on-failure -R '^runtime-recovery-contract$'
          if ($LASTEXITCODE -ne 0) { throw 'Recovery checks failed.' }
      - name: Publish portable CLI
        run: dotnet publish .\src\CrimsonDesertTelemetry.Cli -c Release -r win-x64 --self-contained false -o .\artifacts\win-x64
