name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml]$props = Get-Content .\Directory.Build.props
          if ($version -ne $props.Project.PropertyGroup.Version) { throw 'Tag and product version do not match.' }
          if (-not (Test-Path -LiteralPath ".\docs\releases\v$version.md")) { throw 'Missing release notes.' }
      - name: Build managed projects
        run: dotnet build .\CrimsonDesertTelemetry.sln -c Release
      - name: Managed regression tests
        run: dotnet run --project .\tests\CrimsonDesertTelemetry.Tests -c Release --no-build
      - name: API smoke test
        shell: pwsh
        run: .\tests\Test-Server.ps1
      - name: Build ASI mod-manager package
        shell: pwsh
        run: |
          .\scripts\Build-ModManagerPackage.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')
      - name: Native regression tests
        run: ctest --test-dir build/native-package-release -C Release --output-on-failure
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $package = ".\artifacts\mod-manager\CrimsonDesertTelemetry-$env:GITHUB_REF_NAME-ModManagers.zip"
          gh release create $env:GITHUB_REF_NAME $package --draft --title "Crimson Desert Telemetry $env:GITHUB_REF_NAME" --notes-file ".\docs\releases\$env:GITHUB_REF_NAME.md" --verify-tag
